<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Marco cuadrado -->
  <rect x="3" y="3" width="14" height="14" rx="2" fill="none" stroke="#2196F3" stroke-width="1.5"/>
  
  <!-- Flechas en las 4 esquinas apuntando al centro -->
  <!-- Superior izquierda -->
  <polygon points="6,6 9,6 6,9" fill="#4CAF50"/>
  
  <!-- Superior derecha -->
  <polygon points="14,6 11,6 14,9" fill="#4CAF50"/>
  
  <!-- Inferior izquierda -->
  <polygon points="6,14 9,14 6,11" fill="#4CAF50"/>
  
  <!-- Inferior derecha -->
  <polygon points="14,14 11,14 14,11" fill="#4CAF50"/>
</svg>