<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100">
  <!-- Marco exterior -->
  <rect x="8" y="8" width="84" height="84" rx="8" fill="none" stroke="#2196F3" stroke-width="2"/>
  
  <!-- Barra superior -->
  <rect x="8" y="8" width="84" height="20" rx="8" fill="#2196F3" opacity="0.15"/>
  
  <!-- Botones -->
  <circle cx="20" cy="18" r="3" fill="#F44336"/>
  <circle cx="30" cy="18" r="3" fill="#FFC107"/>
  <circle cx="40" cy="18" r="3" fill="#4CAF50"/>
  
  <!-- Contenido: error -->
  <g transform="translate(50, 65)">
    <!-- Círculo rojo -->
    <circle cx="0" cy="0" r="14" fill="none" stroke="#F44336" stroke-width="2.5"/>
    <!-- Línea diagonal -->
    <line x1="-8" y1="-8" x2="8" y2="8" stroke="#F44336" stroke-width="2.5" stroke-linecap="round"/>
    
  </g>
</svg>