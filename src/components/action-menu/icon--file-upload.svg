<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">
  <!-- Contenedor / archivo (base) -->
  <rect x="3" y="12" width="14" height="5" rx="1" fill="#2196F3" opacity="0.3"/>
  <rect x="3" y="12" width="14" height="1" fill="#2196F3"/>
  
  <!-- Flecha hacia arriba (subir) -->
  <g transform="translate(10, 8)">
    <!-- Línea vertical -->
    <line x1="0" y1="5" x2="0" y2="-4" stroke="#2196F3" stroke-width="2" stroke-linecap="round"/>
    <!-- Cabeza de flecha -->
    <polygon points="0,-6 -3,-2 3,-2" fill="#2196F3"/>
  </g>
</svg>